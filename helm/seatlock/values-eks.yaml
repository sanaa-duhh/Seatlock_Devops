# Overrides for the AWS EKS environment, deployed by Argo CD (gitops/application.yaml).
# CI rewrites both image tags to the commit SHA after the images pass every gate.
backend:
  image: ghcr.io/sanaa-duhh/seatlock-backend
  tag: 78d41c21f68fcb31a00f78bd42dbe494dfad4f82
frontend:
  image: ghcr.io/sanaa-duhh/seatlock-frontend
  tag: 78d41c21f68fcb31a00f78bd42dbe494dfad4f82
imagePullPolicy: IfNotPresent # tags are immutable commit SHAs
postgres:
  storageClass: seatlock-gp3
  storage: 2Gi
ingress:
  enabled: true
  className: traefik
  host: "" # one app per cluster: accept any hostname (NLB name or node IP)
monitoring:
  enabled: true
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  cpuTarget: 60
