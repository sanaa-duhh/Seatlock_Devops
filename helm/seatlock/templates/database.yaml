apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "seatlock.labels" . | nindent 4 }}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: seatlock-postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seatlock-postgres
  labels: {{- include "seatlock.labels" . | nindent 4 }}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: seatlock-postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: seatlock-postgres}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 999, runAsUser: 999, runAsGroup: 999, runAsNonRoot: true}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: seatlock}
            - {name: POSTGRES_DB, value: seatlock}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: postgres-password}
          readinessProbe:
            exec: {command: [pg_isready, -U, seatlock, -d, seatlock]}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.postgres.storageClass }}
        storageClassName: {{ .Values.postgres.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
