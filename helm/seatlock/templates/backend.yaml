apiVersion: apps/v1
kind: Deployment
metadata:
  name: seatlock-backend
  labels: {{- include "seatlock.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/name: seatlock-backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: seatlock-backend}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "seatlock.image" .Values.backend | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          lifecycle:
            preStop: {exec: {command: [sh, -c, "sleep 5"]}}
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: seatlock-config}}]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: database-url}
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: admin-token}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          resources: {{ toYaml .Values.backendResources | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: {app.kubernetes.io/name: seatlock-backend, app.kubernetes.io/part-of: seatlock}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: seatlock-backend}
  ports: [{name: http, port: 8000, targetPort: http}]
