apiVersion: apps/v1
kind: Deployment
metadata:
  name: seatlock-frontend
  labels: {{- include "seatlock.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/name: seatlock-frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: seatlock-frontend}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 101}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "seatlock.image" .Values.frontend | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          lifecycle:
            preStop: {exec: {command: [sh, -c, "sleep 5"]}}
          ports: [{name: http, containerPort: 8080}]
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources: {{ toYaml .Values.frontendResources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {{- include "seatlock.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: seatlock-frontend}
  ports: [{name: http, port: 80, targetPort: http}]
