name: seatlock
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/configure.py first}
      POSTGRES_DB: seatlock
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatlock -d seatlock"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: ./backend
    image: seatlock-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://seatlock:${POSTGRES_PASSWORD}@postgres:5432/seatlock
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    build:
      context: ./backend
    image: seatlock-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://seatlock:${POSTGRES_PASSWORD}@postgres:5432/seatlock
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Run python3 scripts/configure.py first}
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
      HOLD_SECONDS: "300"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  frontend:
    build:
      context: ./frontend
    image: seatlock-frontend:local
    ports: ["127.0.0.1:3000:8080"]
    depends_on:
      backend: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  postgres-test:
    image: postgres:15
    profiles: ["test"]
    environment:
      POSTGRES_USER: seatlock_test
      POSTGRES_PASSWORD: test_only
      POSTGRES_DB: seatlock_test
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatlock_test -d seatlock_test"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
