# LAB 1 - ImagePullBackOff: the tag does not exist in the registry.
# Fix: correct the tag (see README.md), then `kubectl apply -f` again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-web
  namespace: seatlock-drill
  labels: {app: lab-web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: lab-web}
  template:
    metadata:
      labels: {app: lab-web}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.99-does-not-exist # BUG: no such tag
          ports: [{containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes: [{name: tmp, emptyDir: {}}]
