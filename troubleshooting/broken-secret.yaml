# LAB 4 - CreateContainerConfigError: env var references a Secret key that does not exist.
apiVersion: v1
kind: Secret
metadata:
  name: lab-db
  namespace: seatlock-drill
type: Opaque
stringData:
  database-url: postgresql://lab:lab@postgres:5432/lab # demo value, not a real credential
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-config
  namespace: seatlock-drill
spec:
  replicas: 1
  selector:
    matchLabels: {app: lab-config}
  template:
    metadata:
      labels: {app: lab-config}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:stable-alpine
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: lab-db, key: database_url} # BUG: the key is database-url
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes: [{name: tmp, emptyDir: {}}]
