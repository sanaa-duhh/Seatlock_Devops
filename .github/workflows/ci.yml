name: CI/CD

# Pull requests run every quality and security gate. Pushes to main also publish
# the scanned images to GHCR and deploy them to EKS.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main-branch run halfway through a deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  backend:
    name: Backend tests and SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: seatlock_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: seatlock_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U seatlock_test -d seatlock_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://seatlock_test:test_only@localhost:5432/seatlock_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint and format check (ruff)
        run: |
          ruff check app tests
          ruff format --check app tests alembic
      - name: Unit and integration tests (pytest)
        run: pytest -v --cov=app --cov-report=term --cov-fail-under=80 --junitxml=test-results.xml
      - name: Static security analysis (bandit)
        run: bandit -r app -ll
      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt --no-deps --disable-pip
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: backend-test-results, path: backend/test-results.xml}

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format check (prettier)
        run: npm run format:check
      - name: Dependency vulnerability audit (npm audit)
        run: npm audit --audit-level=high
      - name: Type-check and build
        run: npm run build

  iac:
    name: IaC validation and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Secret scan across full Git history (gitleaks)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --config /repo/.gitleaks.toml --redact --exit-code 1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: {terraform_version: 1.16.4}
      - name: Terraform fmt and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Install checksum-verified helm
        run: bash scripts/ci-tools.sh
      - name: Helm lint and render
        run: |
          helm lint helm/seatlock
          helm lint helm/seatlock -f helm/seatlock/values-eks.yaml --set ingress.host=example.com
          helm template seatlock helm/seatlock --set ingress.enabled=true --set monitoring.enabled=true > /dev/null
      - name: Misconfiguration scan of Terraform, Helm and Dockerfiles (trivy)
        run: >-
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" config
          --severity HIGH,CRITICAL --exit-code 1 --ignorefile /src/.trivyignore
          --skip-dirs /src/terraform/.terraform /src
      - name: Scanner negative controls (planted secret and unsafe code must be caught)
        run: |
          pip install -q "$(grep -i '^bandit==' backend/requirements-dev.txt)"
          python3 scripts/check-security-gates.py

  image:
    name: Build and scan ${{ matrix.component }} image
    needs: [backend, frontend, iac]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Build image tagged with the commit SHA
        run: |
          docker build --platform linux/amd64 \
            --build-arg APP_VERSION="$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "seatlock-${{ matrix.component }}:$GITHUB_SHA" ${{ matrix.component }}
      - name: Trivy scan - fail on HIGH or CRITICAL vulnerabilities
        run: |
          mkdir -p reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --exit-code 1 "seatlock-${{ matrix.component }}:$GITHUB_SHA"
      - name: Save JSON scan report
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD/reports:/reports" "$TRIVY_IMAGE" image --format json --output /reports/trivy-${{ matrix.component }}.json \
            "seatlock-${{ matrix.component }}:$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-${{ matrix.component }}
          path: reports/
      - name: Export the exact scanned image
        run: docker save -o image.tar "seatlock-${{ matrix.component }}:$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.component }}
          path: image.tar
          retention-days: 2

  e2e:
    name: Browser tests on Docker Compose
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the full stack
        run: |
          python3 scripts/configure.py
          docker compose up -d --build --wait
      - name: Playwright (desktop and mobile)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          PLAYWRIGHT_CHANNEL=chromium npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-compose
          path: |
            docs/screenshots/e2e/
            frontend/test-results/
      - name: Stop stack
        if: always()
        run: docker compose down --volumes

  kubernetes:
    name: Helm deploy to ephemeral kind cluster
    needs: [image, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: image-*}
      - name: Install checksum-verified kind and helm
        run: bash scripts/ci-tools.sh
      - name: Create cluster and install the chart with the scanned images
        run: |
          docker load -i image-backend/image.tar
          docker load -i image-frontend/image.tar
          kind create cluster --name seatlock --wait 90s \
            --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          kind load docker-image "seatlock-backend:$GITHUB_SHA" "seatlock-frontend:$GITHUB_SHA" --name seatlock
          kubectl apply -f k8s/namespace.yaml
          python3 scripts/configure.py
          python3 scripts/kube-secret.py
          helm upgrade --install seatlock helm/seatlock -n seatlock \
            --set-string backend.tag="$GITHUB_SHA" --set-string frontend.tag="$GITHUB_SHA" \
            --set hpa.enabled=false --wait --wait-for-jobs --timeout 5m
          kubectl -n seatlock get pods,svc -o wide
      - name: Booking lifecycle through the cluster (Playwright)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          # Background processes do not survive between steps, so forward in this one.
          kubectl -n seatlock port-forward svc/frontend 3000:80 > port-forward.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://localhost:3000/api/events > /dev/null && break; sleep 2; done
          PLAYWRIGHT_CHANNEL=chromium EVIDENCE_PREFIX=kind npm run test:e2e
      - name: Cluster diagnostics
        if: failure()
        run: |
          kubectl -n seatlock get all,events
          kubectl -n seatlock logs -l app.kubernetes.io/name=seatlock-backend --tail=50

  publish:
    name: Push images to GHCR
    needs: kubernetes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: image-*}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the same images that passed every gate
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for component in backend frontend; do
            docker load -i "image-$component/image.tar"
            remote="ghcr.io/$owner/seatlock-$component:$GITHUB_SHA"
            docker tag "seatlock-$component:$GITHUB_SHA" "$remote"
            docker push "$remote"
            echo "- \`$remote\`" >> "$GITHUB_STEP_SUMMARY"
          done

  deploy:
    name: Deploy to EKS
    needs: publish
    # Skipped automatically while no cluster exists (the variable is removed on teardown).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.EKS_CLUSTER_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: http://${{ vars.APP_HOSTNAME }}
    permissions:
      contents: read
      id-token: write # lets the OIDC path exchange GitHub's token for AWS credentials
    env:
      HOST: ${{ vars.APP_HOSTNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # Preferred: keyless OIDC role session. Fallback: a deploy-only IAM user's key, for
      # accounts whose policies forbid OIDC providers (terraform github_deploy_auth).
      - name: AWS credentials (OIDC role)
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: AWS credentials (deploy user)
        if: vars.AWS_DEPLOY_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"
      - name: Install checksum-verified helm
        run: bash scripts/ci-tools.sh
      - name: helm upgrade (rolls back automatically on failure)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          helm upgrade --install seatlock helm/seatlock -n seatlock -f helm/seatlock/values-eks.yaml \
            --set backend.image="ghcr.io/$owner/seatlock-backend" \
            --set frontend.image="ghcr.io/$owner/seatlock-frontend" \
            --set-string backend.tag="$GITHUB_SHA" --set-string frontend.tag="$GITHUB_SHA" \
            --set-string config.allowedOrigins="http://$HOST" \
            --rollback-on-failure --wait --wait-for-jobs --timeout 10m
      - name: Smoke test through the public Ingress
        run: |
          for i in $(seq 1 30); do curl -fsS "http://$HOST/" > /dev/null && break; sleep 5; done
          curl -fsS "http://$HOST/api/events" | python3 -c "import json,sys; e=json.load(sys.stdin); assert e, 'no events'; print(len(e), 'events')"
          running="$(kubectl -n seatlock get deploy seatlock-backend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          [[ "$running" == *":$GITHUB_SHA" ]] || { echo "Running $running, expected $GITHUB_SHA" >&2; exit 1; }
          kubectl -n seatlock get pods,svc,ingress,hpa
          {
            echo "### Deployed \`${GITHUB_SHA:0:7}\` to EKS"
            echo "App: http://$HOST"
            helm history seatlock -n seatlock --max 5 | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
